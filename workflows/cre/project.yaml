# CRE project settings. SEPOLIA_RPC_URL must be set (scripts/env.sh defaults it to PublicNode).
# To switch to NOWNodes: SEPOLIA_RPC_URL=https://eth-sepolia.nownodes.io/<key> in ~/.attesta-secrets/cre.env
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: ${SEPOLIA_RPC_URL}

# Receiver-free dry run target. RPC still needed: the workflow does real EVM reads.
local-simulation:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: ${SEPOLIA_RPC_URL}
